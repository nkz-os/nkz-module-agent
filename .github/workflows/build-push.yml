# =============================================================================
# Agent - GitHub Actions CI/CD
# =============================================================================
# On push to main or a version tag:
#   1. Type-check frontend + run backend tests
#   2. Build the Module Federation 2.0 remote (dist/remoteEntry.js,
#      dist/mf-manifest.json, dist/assets/*) — uploaded as artifact
#   3. Build and push the backend Docker image to GHCR (if module has a backend)
#
# After customizing for your module, add MinIO deploy + activation steps
# for immutable versioned deploys (see nkz-module-vpn for reference).
# =============================================================================

name: Build and Push

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    pull_request:
        branches:
            - main

env:
    REGISTRY: ghcr.io
    BACKEND_IMAGE: ghcr.io/${{ github.repository }}/agent-backend

jobs:
    # ==========================================================================
    # Placeholder guard
    # ==========================================================================
    # The template ships uppercase placeholders, and a placeholder image name is
    # a syntactically VALID image reference — so a build that runs before
    # scripts/init-module.sh publishes a real GHCR package under the placeholder
    # name instead of failing. That is exactly how the stale
    # lowercased placeholder packages on GHCR were created.
    #
    # This job derives the answer from BACKEND_IMAGE itself, so the build and
    # publish jobs switch themselves on the moment init-module.sh has run.
    # Do NOT gate them by hand.
    guard:
        name: Placeholder guard
        runs-on: ubuntu-latest
        outputs:
            initialised: ${{ steps.check.outputs.initialised }}
        steps:
            - name: Check the module has been initialised
              id: check
              run: |
                  # A container image reference cannot contain uppercase, so an
                  # uppercase segment here means the template placeholders are
                  # still in place. This check deliberately does NOT spell the
                  # placeholder out: init-module.sh rewrites every occurrence of
                  # it and would rewrite this test along with it, permanently
                  # disabling the build.
                  case "${BACKEND_IMAGE##*/}" in
                      *[[:upper:]]*)
                          echo "initialised=false" >> "$GITHUB_OUTPUT"
                          echo "::notice title=Template not initialised::Placeholders are still in place. Run scripts/init-module.sh; build and publish stay skipped until then."
                          ;;
                      *)
                          echo "initialised=true" >> "$GITHUB_OUTPUT"
                          ;;
                  esac

    # ==========================================================================
    # Test
    # ==========================================================================
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm run typecheck

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"
                  cache-dependency-path: backend/requirements.txt

            - name: Install backend dependencies
              run: pip install -r backend/requirements.txt

            - name: Run backend tests
              run: cd backend && python -m pytest tests/ -v

    # ==========================================================================
    # Build Module Federation 2.0 remote
    # ==========================================================================
    # Skipped while the template's placeholder ids are still in place (they fail
    # the nkzModulePreset kebab-case validator). Enables itself automatically
    # once scripts/init-module.sh has replaced them — see the `guard` job.
    build-module:
        name: Build MF2 Bundle
        runs-on: ubuntu-latest
        needs: [test, guard]
        if: needs.guard.outputs.initialised == 'true'
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build module bundle
              run: pnpm run build:module
              env:
                NKZ_VERSION_HASH: ${{ github.sha }}

            - name: Upload bundle artifact
              uses: actions/upload-artifact@v4
              with:
                  name: nkz-module
                  path: dist/
                  retention-days: 30

    # ==========================================================================
    # Build and push backend Docker image
    # ==========================================================================
    # Skipped until the placeholders are replaced — see the `guard` job. Without
    # this gate the image would publish as `agent-backend`.
    build-backend:
        name: Build Backend Image
        runs-on: ubuntu-latest
        needs: [test, guard]
        if: ${{ needs.guard.outputs.initialised == 'true' && github.event_name != 'pull_request' }}
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Backend
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.BACKEND_IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,prefix=

            - name: Build and push Backend image
              uses: docker/build-push-action@v5

    # ==========================================================================
    # Publish MF2 remote (main only) via canonical OIDC workflow
    # ==========================================================================
    # Skipped until the placeholders are replaced — see the `guard` job. The
    # placeholder module_id is not registered in the platform, so publishing 404s.
    # Remember to register the module id before the first publish.
    publish-module:
        name: Publish Module
        needs: [test, guard]
        if: ${{ needs.guard.outputs.initialised == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        permissions:
            id-token: write
            contents: read
        uses: nkz-os/nkz/.github/workflows/_publish-module.yml@main
        with:
            module_id: "agent"
        secrets:
            INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
